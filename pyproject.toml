[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftformer"
version = "0.2.0"
description = "Transformation x normalization selection with Transformer denoising (v1)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "torch"]

[project.scripts]
shiftformer = "shiftformer.cli:main"

[tool.setuptools]
packages = ["shiftformer"]
